name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  snapshot:
    if: github.event_name == 'pull_request'
    name: Snapshot Docker Image to ECR
    runs-on: ubuntu-latest
    environment: stg
    env:
      ENVIRONMENT: stg
      APP_NAME: dome-adapter
      REGION_CODE: ew1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Get Project Metadata
        run: |
          echo "PROJECT_NAME=$(./gradlew -q properties | grep '^name:' | awk '{print $2}')" >> $GITHUB_ENV
          echo "VERSION=$(./gradlew -q properties | grep '^version:' | awk '{print $2}')" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Snapshot Image
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          VERSION: ${{ env.VERSION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: eudistack-${{ env.ENVIRONMENT }}-ecr-${{ env.REGION_CODE }}-${{ env.APP_NAME }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-pr-${{ github.event.number }}"

          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"

          docker build --build-arg SKIP_TESTS=true -t "${ECR_IMAGE}" .
          docker push "${ECR_IMAGE}"

          echo "### 🐳 Snapshot image pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR:** \`${ECR_IMAGE}\`" >> $GITHUB_STEP_SUMMARY

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Release Docker Image to ECR
    runs-on: ubuntu-latest
    environment: stg
    env:
      ENVIRONMENT: stg
      APP_NAME: dome-adapter
      REGION_CODE: ew1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Get Project Metadata
        run: |
          echo "PROJECT_NAME=$(./gradlew -q properties | grep '^name:' | awk '{print $2}')" >> $GITHUB_ENV
          echo "VERSION=$(./gradlew -q properties | grep '^version:' | awk '{print $2}')" >> $GITHUB_ENV

      - name: Check if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "::notice::Release v${VERSION} already exists — skipping."
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        if: env.SKIP_RELEASE != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.SKIP_RELEASE != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Release Image
        if: env.SKIP_RELEASE != 'true'
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          VERSION: ${{ env.VERSION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: eudistack-${{ env.ENVIRONMENT }}-ecr-${{ env.REGION_CODE }}-${{ env.APP_NAME }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          ECR_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker build --build-arg SKIP_TESTS=true -t "${ECR_IMAGE}" .

          docker tag "${ECR_IMAGE}" "${ECR_LATEST}"

          docker push "${ECR_IMAGE}"
          docker push "${ECR_LATEST}"

          echo "### 🐳 Release image pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR:** \`${ECR_IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest:** \`${ECR_LATEST}\`" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Release of version v${VERSION}" \
            --target main

      - name: Trigger deploy to STG
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml -f environment=stg
          echo "### Deploy triggered" >> $GITHUB_STEP_SUMMARY