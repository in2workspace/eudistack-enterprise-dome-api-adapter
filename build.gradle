plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'checkstyle'
	id 'org.sonarqube' version '7.2.2.6593'
	id 'org.owasp.dependencycheck' version '12.2.0'
}

group = 'es.altia'
version = '0.0.6'

jacoco {
	toolVersion = "0.8.14"
}

sonar {
	properties {
		property 'sonar.projectKey', 'in2workspace_eudistack-enterprise-dome-api-adapter'
		property 'sonar.organization', 'in2workspace'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.sources', 'src/main/java,src/main/resources'
		property 'sonar.exclusions', 'src/main/resources/**/*.sql'
		property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring WebFlux (reactive — replaces spring-boot-starter-web)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// Persistence (reactive)
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework:spring-jdbc'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// JSON
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	// JWT / Crypto
	implementation 'com.nimbusds:nimbus-jose-jwt:9.40'
	implementation 'io.github.novacrypto:Base58:2022.01.17'
	implementation 'org.bitcoinj:bitcoinj-core:0.17-alpha5'

	// Actuator / Monitoring
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// SpringDoc
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.5.0'

	// Annotations
	implementation 'com.google.code.findbugs:jsr305:3.0.2'

	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:r2dbc'
	testRuntimeOnly 'io.r2dbc:r2dbc-h2'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy(tasks.jacocoTestReport)
}

tasks.jacocoTestReport {
	dependsOn(tasks.test)
	reports {
		xml.required.set(true)
		csv.required.set(false)
		html.outputLocation.set(layout.buildDirectory.dir('jacocoHtml'))
	}
}

checkstyle {
	toolVersion = '10.16.0'
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

checkstyleMain {
	source = 'src/main/java'
}

checkstyleTest {
	source = 'src/test/java'
}

dependencyCheck {
	failBuildOnCVSS = 7
	formats = ['HTML', 'JSON']
	suppressionFile = "${rootDir}/config/dependency-check/suppressions.xml"
}
